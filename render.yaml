# Render Blueprint: a free static site (static sites never sleep).
services:
  - type: web
    name: dallar-site
    runtime: static
    buildCommand: ""
    staticPublishPath: ./public
    routes:
      - type: rewrite
        source: /privacy
        destination: /privacy.html
      - type: rewrite
        source: /terms
        destination: /terms.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
